name: Compile MakeROM (on master branch)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Compile ${{ matrix.prog }} for ${{ matrix.dist }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        dist: [ubuntu_x86_64, macos_x86_64, macos_arm64, win_x86_64]
        prog: [makerom]
        include:
          - dist: ubuntu_x86_64
            os: ubuntu-latest
            arch: x86_64
          - dist: macos_x86_64
            os: macos-latest
            arch: x86_64
          - dist: macos_arm64
            os: macos-latest
            arch: arm64
          - dist: win_x86_64
            os: windows-latest
            arch: x86_64
            binExt: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile ${{ matrix.prog }}
        working-directory: ${{ matrix.prog }}
        run: make PROJECT_PLATFORM_ARCH=${{ matrix.arch }} deps all
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prog }}-${{ matrix.dist }}
          path: ./${{ matrix.prog }}/bin/${{ matrix.prog }}${{ matrix.binExt }}
          if-no-files-found: error

  # Fork only (tinaut1986/Project_CTR): every push to master replaces the binaries of one fixed release, so scripts can
  # always download the latest build from the same URL. Never runs in the upstream repository.
  publish:
    name: Publish to the makerom-latest release
    # always(): a platform GitHub has no runner for (macOS x86_64 queues for hours) must not hold back the others.
    if: always() && github.repository == 'tinaut1986/Project_CTR' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          for d in artifacts/makerom-*; do
            dist=${d#artifacts/makerom-}
            for f in "$d"/*; do
              ext=""; case "$f" in *.exe) ext=".exe" ;; esac
              cp "$f" "out/makerom-$dist$ext"
            done
          done
          ls -la out
          [ -f out/makerom-win_x86_64.exe ] || { echo "no Windows build: nothing published"; exit 1; }
          notes="makerom built from ${GITHUB_SHA::7} on master of this fork (fix for the minor title version, 3DSGuy/Project_CTR#169). Replaced on every push."
          gh release view makerom-latest >/dev/null 2>&1 || gh release create makerom-latest --title "MakeROM (latest fork build)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit makerom-latest --notes "$notes"
          gh release upload makerom-latest out/* --clobber
